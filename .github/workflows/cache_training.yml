name: Cache training

on: 
  # schedule:
  #   # every _ hours
  #   - cron: '0 */6 * * *'
  push:
    tags:        
      - '*'           # Push events to every tag not containing /
  workflow_dispatch:
          
jobs:
  package:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]
    permissions: write-all

    steps:
    - uses: actions/checkout@v3
    
    - uses: pdm-project/setup-pdm@v3
      with:
        python-version: ${{ matrix.python-version }}
        update-python: true
        cache: true

    - name: Install package (to use project CLI/executable)
      run: |
        pip install -e .

    - name: Configure aws credentials
      env:
        AWS_IAM_ROLE: ${{ vars.AWS_IAM_ROLE }}
        AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_IAM_ROLE }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - name: Update session status
      env:
        DBHUB_API_KEY: ${{ secrets.DBHUB_API_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        CODE_OCEAN_API_TOKEN: ${{ secrets.CODE_OCEAN_API_TOKEN }}
        CODE_OCEAN_DOMAIN: ${{ secrets.CODE_OCEAN_DOMAIN }}
      run: |
        write_cache --session-type training --log-level INFO --parallel
